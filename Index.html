<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para ti con todo mi amor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(ellipse at bottom, #1b1b2f 0%, #0d0d1a 100%);
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Estrellas de fondo */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .star {
            position: absolute;
            background-color: #ffb6c1;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite ease-in-out;
            opacity: 0.3;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 8px #ff69b4; }
        }

        /* Contenedor principal de cartas flotantes */
        .sky-container {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* Estilo de las cartas volantes */
        .floating-letter {
            position: absolute;
            width: 65px;
            height: 45px;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            border-radius: 6px;
            cursor: pointer;
            pointer-events: auto;
            box-shadow: 0 5px 15px rgba(255, 105, 180, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            animation: floatLetter var(--speed) infinite linear;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .floating-letter:hover {
            transform: scale(1.2) rotate(5deg);
            box-shadow: 0 8px 25px rgba(255, 182, 193, 0.8);
            z-index: 10;
        }

        .floating-letter::before {
            content: "✉";
            font-size: 22px;
            color: #fff;
        }

        @keyframes floatLetter {
            0% {
                transform: translateY(105vh) translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-15vh) translateX(var(--wind)) rotate(360deg);
                opacity: 0;
            }
        }

        /* Mensaje central de bienvenida */
        .welcome-box {
            position: relative;
            z-index: 5;
            text-align: center;
            background: rgba(20, 20, 35, 0.7);
            padding: 30px 40px;
            border-radius: 20px;
            border: 1px solid rgba(255, 182, 193, 0.3);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            max-width: 90%;
            width: 400px;
        }

        .welcome-box h1 {
            font-size: 26px;
            color: #ff9a9e;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 154, 158, 0.5);
        }

        .welcome-box p {
            font-size: 15px;
            color: #e2e8f0;
            line-height: 1.5;
        }

        .hint {
            margin-top: 15px;
            font-size: 13px;
            color: #ffb6c1;
            font-style: italic;
            animation: pulseHint 2s infinite;
        }

        @keyframes pulseHint {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        /* Modal / Ventana emergente para leer la carta */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            backdrop-filter: blur(5px);
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: linear-gradient(135deg, #fff0f3, #ffe3e8);
            color: #4a1525;
            width: 85%;
            max-width: 450px;
            padding: 35px 30px;
            border-radius: 15px;
            box-shadow: 0 15px 40px rgba(255, 105, 180, 0.3);
            text-align: center;
            position: relative;
            transform: scale(0.7) rotate(-5deg);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 2px dashed #ffb6c1;
        }

        .modal-overlay.active .modal-card {
            transform: scale(1) rotate(0deg);
        }

        .modal-card h3 {
            color: #d81b60;
            font-size: 20px;
            margin-bottom: 15px;
            border-bottom: 1px solid #ffb6c1;
            padding-bottom: 8px;
        }

        .modal-card p {
            font-size: 17px;
            line-height: 1.6;
            margin-bottom: 25px;
            font-weight: 500;
        }

        .close-btn {
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 15px;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.4);
            transition: transform 0.2s, background 0.2s;
        }

        .close-btn:hover {
            transform: scale(1.05);
            background: linear-gradient(135deg, #ff5270, #ff6599);
        }

        /* Corazones flotantes extras al abrir carta */
        .heart-float {
            position: absolute;
            color: #ff69b4;
            font-size: 20px;
            pointer-events: none;
            animation: burstHeart 1s forwards ease-out;
        }

        @keyframes burstHeart {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(1.8); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Fondo de estrellas -->
    <div class="stars" id="starsContainer"></div>

    <!-- Contenedor de cartas volantes -->
    <div class="sky-container" id="skyContainer"></div>

    <!-- Tarjeta de bienvenida central -->
    <div class="welcome-box">
        <h1>Para ti, con todo mi corazón</h1>
        <p>Este cielo está lleno de pequeños pedazos de lo que siento por ti.</p>
        <div class="hint">✨ Toca las cartitas que flotan para leer los mensajes ✨</div>
    </div>

    <!-- Ventana Modal para mostrar los mensajes -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-card" id="modalCard">
            <h3>Un pensamiento para ti 💌</h3>
            <p id="modalMessage">Aquí irá el texto de la carta...</p>
            <button class="close-btn" onclick="closeModal()">Guardar en el corazón ❤️</button>
        </div>
    </div>

    <script>
        // Array con frases hermosas y amorosas
        const phrases = [
            "Eres el casual más hermoso que llegó a mi vida.",
            "Cada latido de mi corazón lleva tu nombre grabado.",
            "Me encantas más de lo que las palabras alcanzan a explicar.",
            "Contigo aprendí que los lugares favoritos no son sitios, son personas.",
            "Tu sonrisa tiene el poder de arreglar cualquiera de mis días grises.",
            "No importa el tiempo ni la distancia, mi lugar siempre es a tu lado.",
            "Brillas tanto que iluminas hasta mis pensamientos más oscuros.",
            "Quiero seguir coleccionando momentos inolvidables contigo.",
            "Tus ojos son mi galaxia favorita en todo este universo.",
            "Gracias por ser esa paz que tanto buscaba y no sabía que necesitaba.",
            "Eres mi coincidencia más bonita y mi certeza más grande.",
            "Si volviera a nacer, te buscaría mucho antes.",
            "Contigo el mundo hace sentido y los problemas pesan menos.",
            "Tu risa es la melodía que siempre quiero escuchar al despertar.",
            "Eres mi refugio seguro cuando el mundo se pone pesado.",
            "A tu lado, cada instante se vuelve mágico y eterno.",
            "No hay estrella en este cielo que brille más que tú.",
            "Te amo no solo por cómo eres, sino por cómo me haces ser cuando estoy contigo.",
            "Eres mi primer pensamiento del día y mi último sueño por la noche.",
            "Prometo cuidarte y quererte bonito todos los días de mi vida."
        ];

        // Generar estrellas de fondo
        const starsContainer = document.getElementById('starsContainer');
        const starCount = 120;

        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            const size = Math.random() * 3 + 1;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.top = `${Math.random() * 100}%`;
            star.style.left = `${Math.random() * 100}%`;
            star.style.setProperty('--duration', `${Math.random() * 3 + 2}s`);
            star.style.animationDelay = `${Math.random() * 5}s`;
            starsContainer.appendChild(star);
        }

        // Sistema de generación continua de cartas flotantes
        const skyContainer = document.getElementById('skyContainer');

        function createFloatingLetter() {
            const letter = document.createElement('div');
            letter.classList.add('floating-letter');

            // Posición aleatoria horizontal, velocidad y viento
            const startX = Math.random() * 95; // porcentaje ancho
            const speed = Math.random() * 8 + 7; // entre 7 y 15 segundos
            const wind = (Math.random() - 0.5) * 150 + 'px'; // desvío lateral

            letter.style.left = `${startX}%`;
            letter.style.setProperty('--speed', `${speed}s`);
            letter.style.setProperty('--wind', wind);

            // Seleccionar una frase aleatoria para esta carta
            const randomPhrase = phrases[Math.floor(Math.random() * phrases.length)];
            letter.dataset.message = randomPhrase;

            // Evento click para abrir la carta
            letter.addEventListener('click', (e) => {
                e.stopPropagation();
                openModal(randomPhrase, e.clientX, e.clientY);
                // Dar un efecto de desvanecimiento o eliminar al abrir opcional, o dejarla volar
                letter.style.opacity = '0.3';
            });

            skyContainer.appendChild(letter);

            // Eliminar elemento del DOM cuando termine su animación para evitar lag
            setTimeout(() => {
                letter.remove();
            }, speed * 1000);
        }

        // Crear una carta nueva cada cierto tiempo
        setInterval(createFloatingLetter, 1200);

        // Control del Modal
        const modalOverlay = document.getElementById('modalOverlay');
        const modalMessage = document.getElementById('modalMessage');

        function openModal(text, x, y) {
            modalMessage.textContent = text;
            modalOverlay.classList.add('active');
            createHeartBurst(x, y);
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
        }

        // Efecto visual de corazones al hacer clic en una carta
        function createHeartBurst(x, y) {
            for (let i = 0; i < 6; i++) {
                const heart = document.createElement('div');
                heart.classList.add('heart-float');
                heart.textContent = '💖';
                heart.style.left = `${x}px`;
                heart.style.top = `${y}px`;

                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 80 + 40;
                const dx = Math.cos(angle) * distance;
                const dy = Math.sin(angle) * distance;

                heart.style.setProperty('--dx', `${dx}px`);
                heart.style.setProperty('--dy', `${dy}px`);

                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 1000);
            }
        }

        // Cerrar modal haciendo clic fuera de la tarjeta
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                closeModal();
            }
        });
    </script>
</body>
      </html>
